<!doctype html>
<html lang="zh-CN"><head><script src="/production-health.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宠物开工啦 · 小小创作街</title><link rel="stylesheet" href="/job-studio.css"><link rel="stylesheet" href="/wish-cloud.css"><link rel="stylesheet" href="/work-template.css"></head>
<body><header class="top"><a href="/job-studio.html" class="brand"><span>✦</span> 小小创作街 <small>把一个点子，变成每天的期待</small></a></header>
<main><section class="hero"><div class="hero-copy"><h1>宠物开工啦！</h1></div><div class="hero-art" role="img" aria-label="水彩画中的报摊、录音棚和探险工作室"><span class="art-label">小小想法 · 大大营业</span></div></section>
<nav id="steps" aria-label="设计进度"></nav><div class="workspace"><section class="desk"><div class="step-heading"><span id="turn"></span><span id="autosave">草稿留在这台设备</span></div><div id="stage"></div><footer class="actions"><button id="back" class="secondary">← 上一步</button><button id="next" class="primary">继续 →</button></footer></section><aside class="preview-desk"><div class="pin"></div><div id="contract"></div><p class="margin-note">每天换一份新内容，<br>我们设计的玩法一直在。</p></aside></div>
<details class="shelf-drawer"><summary>我的作品</summary><section class="shelf"><div><h2>我的工作 <small id="shelf-count"></small></h2></div><button id="new-job" class="secondary">＋ 再想一个工作</button><div id="saved-jobs"></div></section></details></main>
<dialog id="teacher"><form method="dialog"><button class="close" aria-label="关闭老师准备台">×</button></form><h2>老师的准备台</h2><p>才艺展示 → 定事情 → 选特长 → 选岗位玩法 → 确认制作。</p><label for="class-mode">参与方式</label><select id="class-mode"><option value="team">一起设计</option><option value="solo">自己设计</option></select><p>每次只做一个决定，建议可以改，也可以直接说自己的想法。</p><div id="capabilities"></div><p>先把每天怎么玩说清楚。保存后可以先看看，再分享到广场。这里不会马上开始做作品。</p><button id="export" class="secondary">下载这份约定</button></dialog><dialog id="work-dialog"></dialog><div id="toast" role="status"></div>
<script src="/job-studio-ideas.js"></script><script src="/job-studio-model.js"></script><script src="/work-template.js"></script><script src="/job-blueprint.js"></script><script src="/wish-cloud.js"></script><script src="/task-check.js"></script><script src="/talent-studio.js?v=daily-voice"></script><script src="/studio-import.js"></script></body></html>
