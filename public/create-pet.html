<!doctype html>
<html lang="zh-CN"><head><script src="/production-health.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef1df"><title>认识我的新朋友</title><link rel="stylesheet" href="/create-pet.css?v=voice-presets-20261115"></head>
<body><header><a href="/account">我的名字 ↗</a></header>
<main><div class="intro"><h1>把你的朋友，<br>带进小世界。</h1><p>画好它，叫叫它，听它说话。</p></div>
<div class="creation"><aside class="stage"><div class="sun"></div><span class="hanging">新朋友入住中</span><div class="window"><i></i></div><div class="plant">✿</div><div class="rug"></div><img id="pet-picture" hidden alt="我的新朋友"><div id="empty-pet"><span>✧</span><p>你的朋友会站在这里</p></div><div id="pet-tag">等待认识你</div><span class="stage-note">小屋已经准备好啦</span></aside>
<section class="paper"><nav aria-label="创造宠物的步骤"><button data-step="0">1 选照片</button><button data-step="1">2 起名字</button><button data-step="2" hidden>3 听声音</button></nav>
<section data-panel="0"><h2>你的朋友长什么样？</h2><label class="upload"><span>＋</span><strong id="upload-label">选一张宠物的画</strong><small>白色或浅色背景 · 全身照</small><input id="picture" type="file" accept="image/*,.heic,.heif,.avif,.tif,.tiff,.bmp,.gif"></label><p class="hint">我们会帮你去掉背景，保留你的画。</p><button class="primary" id="image-next">就是它，起名字 →</button></section>
<section data-panel="1" hidden><h2>你想叫它什么？</h2><label class="name-label">它的名字<input id="pet-name" maxlength="16" placeholder="在这里输入宠物名字"></label><button class="mic" data-record="name">🎙 <span>也可以说出它的名字</span></button><button class="primary" id="name-next">名字起好啦 →</button></section>
<section data-panel="2" hidden><h2>它说话是什么声音？</h2><div id="voice-presets" class="voice-presets"></div><details><summary>我想描述别的童声</summary><button class="mic" data-record="voice">🎙 <span>描述一下它说话的声音</span></button><p class="hint">示例：它说话软软的，像个女孩的声音，像一只小猫</p><textarea id="voice-words" rows="2" maxlength="600" placeholder="比如：软软的，说话慢一点"></textarea></details><button id="listen" class="primary">♫ 听它说声你好</button><p id="voice-description"></p><audio id="voice-audio" controls hidden></audio><button id="finish" class="primary finish">准备好，一起出发 ✦</button></section>
<p id="status" role="status" aria-live="polite"></p></section></div>
<section id="welcome" class="welcome" hidden><span>✦ 入住成功 ✦</span><h2 id="welcome-title"></h2><p>下次来，还能找到它。</p><div><a class="primary" href="/">去我们的小家 →</a></div></section></main><script src="/create-pet.js?v=voice-in-settings"></script></body></html>
