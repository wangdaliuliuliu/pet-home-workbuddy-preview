<!doctype html><html lang="zh-CN"><head><script src="/production-health.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2e8"><title>找到我的宠物</title><link rel="stylesheet" href="/office.css"><link rel="stylesheet" href="/office-responsive.css"><link rel="stylesheet" href="/child-account.css"></head><body><header class="office-nav"><div class="wordmark"><span class="brand-star">✳</span><span>电子宠物</span></div></header><main><div class="account-layout"><section class="account-story"><h1>你的小伙伴，<br>在这里等你。</h1><p class="form-hint">记住名字和密码，<br>下次就能找到它。</p><div class="account-picture" role="img" aria-label="水彩画的小报摊"></div></section><section class="account-paper"><div id="account-content"><div class="account-tabs" role="group" aria-label="登录或注册"><button type="button" id="login-tab" class="selected">我来过</button><button type="button" id="register-tab">第一次来</button></div><h2 id="form-title">欢迎回来！</h2><form id="auth-form"><label class="form-field">你的名字<input name="name" autocomplete="username" required maxlength="32" placeholder="填你的名字或小名"></label><p id="name-hint" class="form-hint">填你第一次来时用的名字。</p><label class="form-field">密码<input name="password" type="password" minlength="8" maxlength="128" required autocomplete="current-password" placeholder="至少 8 个字母或数字"></label><p class="form-error" id="auth-error" role="alert"></p><button class="ink-button" id="auth-submit">回到我的宠物身边 →</button></form><p class="form-hint">请和大人一起记好名字和密码。</p></div></section></div></main><script src="/account.js"></script><script src="/studio-import.js"></script></body></html>
